<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - IQ E-SPORTS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --p: #0052D4; }
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; padding: 15px; }
        .box { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid var(--p); padding-bottom: 10px; margin-bottom: 20px; font-size: 20px; }
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { width: 100%; padding: 12px; background: var(--p); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .info-link { font-size: 11px; color: #666; margin-top: 4px; display: block; }
    </style>
</head>
<body>

<div class="box">
    <h2>Admin Control Panel</h2>
    
    <div class="field">
        <label>Website Name / Title</label>
        <input type="text" id="siteTitle">
    </div>

    <div class="field">
        <label>APK Download Link</label>
        <input type="text" id="apkLink" placeholder="Paste Google Drive/Mediafire link here">
        <span class="info-link">Note: Use a direct download link for best experience.</span>
    </div>

    <div class="field">
        <label>Logo Image URL</label>
        <input type="text" id="logoUrl">
    </div>

    <div class="field">
        <label>Hero Description</label>
        <textarea id="heroDesc" rows="2"></textarea>
    </div>

    <div class="stats">
        <div class="field"><label>Tournaments</label><input type="number" id="s1"></div>
        <div class="field"><label>Total Players</label><input type="number" id="s2"></div>
        <div class="field"><label>Winning Amount</label><input type="number" id="s3"></div>
        <div class="field"><label>Rewards</label><input type="number" id="s4"></div>
    </div>

    <button onclick="saveSettings()">SAVE & UPDATE SITE</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC4wpKbkeCzrN4IhwmSry4cr-j_f_V7CI0",
        authDomain: "killing-stars.firebaseapp.com",
        databaseURL: "https://killing-stars-default-rtdb.firebaseio.com",
        projectId: "killing-stars",
        storageBucket: "killing-stars.firebasestorage.app",
        messagingSenderId: "467645322062",
        appId: "1:467645322062:web:692e648254686cde03041f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Get Current Data
    onValue(ref(db, 'siteSettings'), (snapshot) => {
        const d = snapshot.val();
        if(d) {
            document.getElementById('siteTitle').value = d.title;
            document.getElementById('apkLink').value = d.apkLink;
            document.getElementById('logoUrl').value = d.logoUrl;
            document.getElementById('heroDesc').value = d.heroDesc;
            document.getElementById('s1').value = d.s1;
            document.getElementById('s2').value = d.s2;
            document.getElementById('s3').value = d.s3;
            document.getElementById('s4').value = d.s4;
        }
    });

    window.saveSettings = () => {
        set(ref(db, 'siteSettings'), {
            title: document.getElementById('siteTitle').value,
            apkLink: document.getElementById('apkLink').value,
            logoUrl: document.getElementById('logoUrl').value,
            heroDesc: document.getElementById('heroDesc').value,
            s1: document.getElementById('s1').value,
            s2: document.getElementById('s2').value,
            s3: document.getElementById('s3').value,
            s4: document.getElementById('s4').value,
            aboutText: "We host elite tournaments for gaming enthusiasts."
        }).then(() => {
            Swal.fire('Updated!', 'Website changed successfully', 'success');
        }).catch(e => alert("Error: " + e.message));
    };
</script>
</body>
</html>
