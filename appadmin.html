<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IQ Admin Panel</title>
    <style>
        body { background: #f4f6f9; font-family: sans-serif; padding: 40px; }
        .panel { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        h2 { color: #0052D4; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        label { font-size: 0.8rem; font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
        button { width: 100%; padding: 15px; background: #0052D4; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>SITE MANAGER</h2>
        <label>APP NAME</label><input type="text" id="title">
        <label>LOGO URL</label><input type="text" id="logo">
        <label>SHORT DESC</label><input type="text" id="desc">
        <label>APK DIRECT LINK</label><input type="text" id="apk">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div><label>MATCHES</label><input type="number" id="s1"></div>
            <div><label>PLAYERS</label><input type="number" id="s2"></div>
            <div><label>WINNINGS</label><input type="number" id="s3"></div>
            <div><label>REWARDS</label><input type="number" id="s4"></div>
        </div>
        <button onclick="save()">SAVE & PUBLISH</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByev8IFSTDraEOnpiPnzuSdqJ-p58tksI",
            authDomain: "h4xsmm06.firebaseapp.com",
            databaseURL: "https://h4xsmm06-default-rtdb.firebaseio.com",
            projectId: "h4xsmm06",
            appId: "1:501931059240:web:5c016b0c37c7936c9dad1d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, 'siteSettings'), (snap) => {
            const d = snap.val();
            if(d) {
                document.getElementById('title').value = d.title;
                document.getElementById('logo').value = d.logoUrl;
                document.getElementById('desc').value = d.heroDesc;
                document.getElementById('apk').value = d.apkLink;
                document.getElementById('s1').value = d.s1;
                document.getElementById('s2').value = d.s2;
                document.getElementById('s3').value = d.s3;
                document.getElementById('s4').value = d.s4;
            }
        });

        window.save = function() {
            set(ref(db, 'siteSettings'), {
                title: document.getElementById('title').value,
                logoUrl: document.getElementById('logo').value,
                heroDesc: document.getElementById('desc').value,
                apkLink: document.getElementById('apk').value,
                s1: document.getElementById('s1').value,
                s2: document.getElementById('s2').value,
                s3: document.getElementById('s3').value,
                s4: document.getElementById('s4').value
            }).then(() => alert("Website Updated!"));
        }
    </script>
</body>
</html>
