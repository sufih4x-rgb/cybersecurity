<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="metaTitle">Play & Earn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Sari styling wahi rahegi jo aapne pehle dekhi thi */
        :root { --blue: #0052D4; --dark: #020024; }
        body { font-family: sans-serif; margin: 0; text-align: center; color: #333; }
        .hero { background: linear-gradient(135deg, var(--dark), var(--blue)); color: #fff; padding: 50px 20px; }
        .app-logo { width: 100px; height: 100px; border-radius: 20px; border: 3px solid gold; margin-bottom: 15px; }
        .dl-btn { display: inline-block; padding: 15px 30px; background: gold; color: #000; text-decoration: none; border-radius: 30px; font-weight: bold; margin-top: 20px; }
        .stats-sec { display: flex; justify-content: space-around; padding: 40px 10px; background: #f9f9f9; }
        .stat-val { font-size: 20px; font-weight: bold; display: block; }
    </style>
</head>
<body>

    <section class="hero">
        <img id="dbLogo" class="app-logo" src="" alt="Logo">
        <h1 class="dbTitle">Loading...</h1>
        <p id="dbHeroDesc">Fetching details...</p>
        <a href="#" id="dbApkLink" class="dl-btn">DOWNLOAD APK</a>
    </section>

    <section class="stats-sec">
        <div><span class="stat-val" id="s1">0</span>Matches</div>
        <div><span class="stat-val" id="s2">0</span>Players</div>
        <div><span class="stat-val" id="s3">0</span>Won</div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4wpKbkeCzrN4IhwmSry4cr-j_f_V7CI0",
            authDomain: "killing-stars.firebaseapp.com",
            databaseURL: "https://killing-stars-default-rtdb.firebaseio.com",
            projectId: "killing-stars",
            appId: "1:467645322062:web:692e648254686cde03041f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, 'siteSettings'), (snap) => {
            const data = snap.val();
            if(data) {
                document.querySelectorAll('.dbTitle').forEach(e => e.innerText = data.title);
                document.getElementById('dbLogo').src = data.logoUrl;
                document.getElementById('dbHeroDesc').innerText = data.heroDesc;
                document.getElementById('dbApkLink').href = data.apkLink;
                document.getElementById('s1').innerText = data.s1;
                document.getElementById('s2').innerText = data.s2;
                document.getElementById('s3').innerText = data.s3;
            }
        });
    </script>
</body>
</html>
