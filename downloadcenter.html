<!DOCTYPE html>

    <style>
        :root { 
            --accent: #f1c40f; 
            --blue: #0052D4;

        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #ffffff; color: #1a1a1a; overflow-x: hidden; }
        .header {
            background: linear-gradient(135deg, var(--dark) 0%, var(--blue) 100%);
            padding: 50px 20px 100px;
            text-align: center;
            color: white;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0% 100%);
        }
        .brand-nav { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .brand-nav img { width: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); }
        .brand-nav span { font-weight: 800; letter-spacing: 2px; font-size: 1.1rem; }
        .icon-box {
            width: 140px; height: 140px;

            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: 4px solid var(--accent);
            position: relative; z-index: 10;
        }
        .icon-box img { width: 100%; height: 100%; border-radius: 30px; object-fit: cover; }
        .content { text-align: center; padding: 20px; }
        h1 { font-size: 2.2rem; font-weight: 800; color: #000; margin-bottom: 10px; }
        .desc { color: #666; font-size: 0.95rem; max-width: 300px; margin: 0 auto 35px; }
        .download-btn {
            background: linear-gradient(to right, #0052D4, #4364F7);
            color: white; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 15px; padding: 20px 45px;
            border-radius: 50px; font-weight: 700;
            box-shadow: 0 12px 30px rgba(67, 100, 247, 0.4);
            transition: 0.3s; width: 100%; max-width: 340px;
            cursor: pointer;
        }
        .download-btn:hover { transform: translateY(-4px); box-shadow: 0 18px 35px rgba(67, 100, 247, 0.5); }
        .download-btn i { font-size: 1.8rem; }
        .stats {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 15px; padding: 40px 20px;
            max-width: 500px; margin: auto;
        }
        .stat-item {
            background: #fdfdfd; border: 1px solid #f0f0f0;
            padding: 25px 15px; border-radius: 24px; text-align: center;
        }
        .stat-item h3 { font-size: 1.6rem; color: var(--blue); font-weight: 800; }
        .stat-item p { font-size: 0.7rem; font-weight: 700; color: #999; text-transform: uppercase; margin-top: 5px; }
        footer { padding: 40px 20px; text-align: center; color: #bbb; font-size: 0.8rem; letter-spacing: 1px; }
    </style>
</head>
<body>
    <section class="header">
        <div class="brand-nav">
            <img src="https://uploads.onecompiler.io/44eaxx4gy/44fw74svu/IMG_20260310_113159_680.jpg" alt="Logo">

        <a href="#" class="download-btn" id="dlTrigger">

            <div style="text-align: left;">
                <span id="appVersion" style="display: block; font-size: 0.7rem; opacity: 0.8; font-weight: 400;">Loading version...</span>
                <span style="font-size: 1.2rem;">DOWNLOAD APK</span>
            </div>
        </a>
    </div>
    <div class="stats">
        <div class="stat-item"><h3>100+</h3><p>Tournaments</p></div>
        <div class="stat-item"><h3>50K+</h3><p>Active Users</p></div>

    <script>
        // Firebase Config (Sufi Bhai ka original config securely bounded)
        const firebaseConfig = {
            apiKey: "AIzaSyAfrFpzw2UddAxGrhAlIeP_c1OaoIG6wNk",
            authDomain: "in-app-update-21c61.firebaseapp.com",
            databaseURL: "https://in-app-update-21c61-default-rtdb.firebaseio.com",
            projectId: "in-app-update-21c61",
            storageBucket: "in-app-update-21c61.firebasestorage.app",
            messagingSenderId: "1013483026768",
            appId: "1:1013483026768:web:c5f54060842f9672431455"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const dlButton = document.getElementById('dlTrigger');
        const versionSpan = document.getElementById('appVersion');
        let downloadUrl = "";

        // Database se data check karna aur live real-time badalna
        database.ref('appUpdate').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                downloadUrl = data.url;
                versionSpan.innerText = "Official Version " + data.version;
            } else {
                versionSpan.innerText = "Official Version 2.0";
            }
        });

        dlButton.addEventListener('click', function(e) {
            e.preventDefault(); // Default instant raw redirect breaks animation, manually triggered safely instead.
            
            if(!downloadUrl || downloadUrl === "" || downloadUrl === "#") {
                Swal.fire({
                    title: 'Error!',
                    text: 'Download link available nahi hai database mein.',
                    icon: 'error',
                    confirmButtonColor: '#0052D4'
                });
                return;
            }
            
            Swal.fire({
                title: 'Downloading...',
                text: 'Your secure installation is starting.',
                icon: 'success',
                showConfirmButton: false,
                timer: 2500,
                background: '#fff',
                color: '#000',
                iconColor: '#0052D4'
            }).then(() => {
                // Direct route allocation starts processing downloading pipeline stream safely
                window.location.href = downloadUrl;
            });
        });
    </script>
</body>
</html>
