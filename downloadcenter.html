<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ E-SPORTS | Download Official App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { 
            --accent: #f1c40f; 
            --blue: #0052D4; 
            --dark: #020024;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { background-color: #ffffff; color: #1a1a1a; overflow-x: hidden; }

        /* Luxury Header */
        .header {
            background: linear-gradient(135deg, var(--dark) 0%, var(--blue) 100%);
            padding: 50px 20px 100px;
            text-align: center;
            color: white;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0% 100%);
        }

        .brand-nav { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .brand-nav img { width: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); }
        .brand-nav span { font-weight: 800; letter-spacing: 2px; font-size: 1.1rem; }

        /* App Icon Card */
        .icon-box {
            width: 140px; height: 140px;
            background: white; margin: -70px auto 20px;
            border-radius: 35px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: 4px solid var(--accent);
            position: relative; z-index: 10;
        }
        .icon-box img { width: 100%; height: 100%; border-radius: 30px; object-fit: cover; }

        .content { text-align: center; padding: 20px; }
        h1 { font-size: 2.2rem; font-weight: 800; color: #000; margin-bottom: 10px; }
        .desc { color: #666; font-size: 0.95rem; max-width: 300px; margin: 0 auto 35px; }

        /* Premium Download Button */
        .download-btn {
            background: linear-gradient(to right, #0052D4, #4364F7);
            color: white; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 15px; padding: 20px 45px;
            border-radius: 50px; font-weight: 700;
            box-shadow: 0 12px 30px rgba(67, 100, 247, 0.4);
            transition: 0.3s; width: 100%; max-width: 340px;
        }
        .download-btn:hover { transform: translateY(-4px); box-shadow: 0 18px 35px rgba(67, 100, 247, 0.5); }
        .download-btn i { font-size: 1.8rem; }

        /* Stats Section */
        .stats {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 15px; padding: 40px 20px;
            max-width: 500px; margin: auto;
        }
        .stat-item {
            background: #fdfdfd; border: 1px solid #f0f0f0;
            padding: 25px 15px; border-radius: 24px; text-align: center;
        }
        .stat-item h3 { font-size: 1.6rem; color: var(--blue); font-weight: 800; }
        .stat-item p { font-size: 0.7rem; font-weight: 700; color: #999; text-transform: uppercase; margin-top: 5px; }

        footer { padding: 40px 20px; text-align: center; color: #bbb; font-size: 0.8rem; letter-spacing: 1px; }
    </style>
</head>
<body>

    <!-- Header Section -->
    <section class="header">
        <div class="brand-nav">
            <!-- CHANGE HERE: Logo for Navbar -->
            <img src="https://uploads.onecompiler.io/44eaxx4gy/44fw74svu/IMG_20260310_113159_680.jpg" alt="Logo">
            <span>IQ ROYALE</span>
        </div>
        <p style="opacity: 0.8; font-weight: 300;">Elite Tournament Experience</p>
    </section>

    <!-- App Icon -->
    <div class="icon-box">
        <!-- CHANGE HERE: Main App Logo -->
        <img src="https://uploads.onecompiler.io/44eaxx4gy/44fw74svu/IMG_20260310_113159_680.jpg" alt="App Icon">
    </div>

    <!-- Main Content -->
    <div class="content">
        <!-- CHANGE HERE: App Name -->
        <h1>IQ E-SPORTS</h1>
        <p class="desc">Host, Play and Earn Rewards in the most premium Esports arena.</p>
        
        <!-- CHANGE HERE: Your Direct APK Link -->
        <a href="https://drive.google.com/uc?export=download&id=18ST3iAT-OYaMBsvA9T-26caOy6aGLJLE" class="download-btn" id="dlTrigger">
            <i class="fab fa-android"></i>
            <div style="text-align: left;">
                <span style="display: block; font-size: 0.7rem; opacity: 0.8; font-weight: 400;">Official Version 2.0</span>
                <span style="font-size: 1.2rem;">DOWNLOAD APK</span>
            </div>
        </a>
    </div>

    <!-- Stats Section (CHANGE NUMBERS HERE) -->
    <div class="stats">
        <div class="stat-item"><h3>100+</h3><p>Tournaments</p></div>
        <div class="stat-item"><h3>50K+</h3><p>Active Users</p></div>
        <div class="stat-item"><h3>₹20L+</h3><p>Total Winnings</p></div>
        <div class="stat-item"><h3>24/7</h3><p>Support</p></div>
    </div>

    <footer>
        <p>&copy; 2026 IQ E-SPORTS ORGANIZATION</p>
        <p style="margin-top: 10px; font-size: 0.6rem;">SECURE & ENCRYPTED INSTALLER</p>
    </footer>

    <script>
        // Simple SweetAlert for Download
        document.getElementById('dlTrigger').addEventListener('click', function(e) {
            Swal.fire({
                title: 'Downloading...',
                text: 'Your secure installation is starting.',
                icon: 'success',
                showConfirmButton: false,
                timer: 3000,
                background: '#fff',
                color: '#000',
                iconColor: '#0052D4'
            });
        });
    </script>
</body>
</html>
